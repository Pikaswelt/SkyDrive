[package]
name = "skydrive"
version = "1.0.0"
description = "SkyDrive – Anime Speicherverwaltung"
authors = ["SkyDrive"]
edition = "2021"

[lib]
name = "skydrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
jwalk = "0.8"
blake3 = "1"
trash = "5"
once_cell = "1"
parking_lot = "0.12"
whoami = "1"
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
